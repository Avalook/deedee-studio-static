name: Build DeeDee CMS app
on:
  workflow_dispatch:
  push:
    tags: ['cms-v*']
    branches: [main]
    paths: ['cms/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cms/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            cms/desktop/release/*.dmg
            cms/desktop/release/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/cms-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "DeeDee CMS ${GITHUB_REF_NAME#cms-v}" --notes "Mac Apple Silicon (arm64), Mac Intel (x64), Windows."
        env:
          GH_TOKEN: ${{ github.token }}
