<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>DeeDee CMS</title>
<style>
  :root { --bg: #fbf9fc; --fg: #231a2b; --muted: #64586f; --line: #d9cfe0; --accent: #8a1fb8; --error: #ad1f3f; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17121c; --fg: #f1ebf5; --muted: #ab9fb6; --line: #3a3144; --accent: #d38bf2; --error: #f4909f; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main, form { display: grid; gap: 16px; }
  main { width: min(420px, calc(100vw - 48px)); }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: var(--muted); }
  label { display: grid; gap: 6px; font-weight: 600; }
  label span { font-weight: 400; color: var(--muted); font-size: 13px; }
  input { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: inherit; }
  button { font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 7px; background: var(--accent); color: var(--bg); cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  #error { color: var(--error); min-height: 1.5em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>DeeDee CMS</h1>
  <p id="status">Đang khởi động…</p>
  <form id="activate" hidden>
    <label>Mã kích hoạt<input id="code" type="password" autocomplete="off" spellcheck="false" required></label>
    <label>Khoá xem form đã nhận <span>Không bắt buộc. Bỏ trống nếu bạn không được cấp.</span><input id="form-key" type="password" autocomplete="off" spellcheck="false"></label>
    <button id="submit" type="submit">Kích hoạt</button>
  </form>
  <p id="error" role="alert"></p>
</main>
<script src="start.js"></script>
</body>
</html>
