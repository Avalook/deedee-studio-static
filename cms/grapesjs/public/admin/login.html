<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — DeeDee Studio CMS</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-body">
<main class="login-card">
  <div class="brand brand--stacked">
    <span class="brand__mark">DS</span>
    <span class="brand__text">DeeDee Studio CMS <small>local archive editor</small></span>
  </div>
  <h1>Sign in to the editor</h1>
  <form id="login-form" novalidate>
    <label class="field">
      <span>Username</span>
      <input name="username" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span>Password</span>
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <p id="login-error" class="form-error" role="alert" hidden></p>
    <button type="submit" class="button button--primary button--wide">Sign in</button>
  </form>
  <div class="login-hint">
    <p><strong>Demo accounts</strong></p>
    <p><code>editor</code> / <code>editor-demo</code> — can edit and preview, cannot publish.</p>
    <p><code>publisher</code> / <code>publisher-demo</code> — can also publish.</p>
    <p>Local evaluation accounts only. Set passwords before shared or hosted use.</p>
  </div>
</main>
<script src="/admin/login.js"></script>
</body>
</html>
